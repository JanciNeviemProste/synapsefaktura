name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Reaguj len na @claude a len od nás dvoch.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      # Bez tokenu by akcia spadla s nezrozumiteľnou chybou pri každom @claude.
      # Radšej ticho preskočíme a povieme, čo treba doplniť — červený krížik na
      # PR, ktorý znamená len "nie je nastavené", naučí ľudí ignorovať červené
      # krížiky.
      - name: Je token nastavený?
        id: token
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN nie je nastavený, preskakujem. Doplníš ho cez \`claude setup-token\` → Settings → Secrets and variables → Actions."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.token.outputs.ok == 'true'
        with:
          # OAuth token z `claude setup-token` — jede na predplatnom (Max), nie na API kredite.
          # Alternatíva: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} (účtuje sa zvlášť).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 12"
