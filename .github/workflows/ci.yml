name: CI

on:
  push:
    branches: [main]
  # No `branches` filter: that filters on the PR's *base*, so a stacked PR
  # (one targeting another feature branch rather than main) never got checked.
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Build must succeed with no external keys (graceful degradation).
          # Real values are configured in the Vercel project, not in CI.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  # Rozsah PR. Zámerne NEPADÁ — dohoda v docs/WORKFLOW.md hovorí "orientačne do
  # 500 riadkov", a orientačne znamená orientačne. Tvrdý limit by zhodil aj
  # legitímne veľké PR (nová migrácia + typy + obrazovka) a naučil by nás
  # obchádzať ho labelom, čo je horšie než čísla len vidieť.
  #
  # Čísla idú do zhrnutia PR, aby ich recenzent mal pred očami skôr, než otvorí
  # diff. PR #15 mal 3 383 riadkov a #12 mal 4 131 — nikto ich neprečítal.
  size:
    name: Rozsah PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zmeraj diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Generované a zamknuté súbory sa nerátajú — nikto ich nečíta.
          SKIP='(pnpm-lock\.yaml|\.snap$|^supabase/migrations/|database\.types\.ts)'
          FILES=$(git diff --name-only "$BASE" "$HEAD" | grep -Ev "$SKIP" | wc -l | tr -d ' ')
          LINES=$(git diff --numstat "$BASE" "$HEAD" | grep -Ev "$SKIP" \
            | awk '{a+=$1; d+=$2} END {print a+d+0}')
          echo "### Rozsah: $FILES súborov, $LINES riadkov (bez generovaných)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$LINES" -gt 500 ]; then
            echo "::warning::$LINES riadkov — dohoda je orientačne 500. Zváž rozdelenie."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Nad dohodnutých 500 riadkov. Väčší PR nikto poriadne neprečíta." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Toto naopak PADÁ. Sú to štyri vzory, ktorými sa typová chyba zametie pod
  # koberec namiesto opravy — a v AI diffe vznikajú tichšie než kdekoľvek inde.
  patterns:
    name: Zakázané vzory
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nové potlačenia typov a lintu
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          ADDED=$(git diff "$BASE" "$HEAD" -- '*.ts' '*.tsx' | grep '^+' | grep -v '^+++' || true)
          FAIL=0
          check() {
            if echo "$ADDED" | grep -qE "$1"; then
              echo "::error::Pridané: $2 — ak to naozaj treba, napíš vedľa komentár prečo."
              echo "$ADDED" | grep -nE "$1" | head -5
              FAIL=1
            fi
          }
          check '@ts-ignore'                 '@ts-ignore'
          check 'eslint-disable'             'eslint-disable'
          check '\bas any\b'                 'as any'
          check 'catch\s*\(\s*\)\s*\{\s*\}'  'prázdny catch'
          [ "$FAIL" = 0 ] || exit 1

      - name: Test a zdroj v jednej zmene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          T=$(echo "$CHANGED" | grep -cE '\.(test|spec)\.(ts|tsx)$' || true)
          S=$(echo "$CHANGED" | grep -E '\.(ts|tsx)$' | grep -vcE '\.(test|spec)\.' || true)
          if [ "$T" -gt 0 ] && [ "$S" -gt 0 ]; then
            echo "::warning::PR mení testy ($T) aj zdroják ($S). Recenzent nech overí, že sa test neupravoval preto, aby prešiel kód."
          fi

  # Applies every migration to an EMPTY database, in filename order — exactly
  # what a fresh project would do. Migrations applied one-by-one to a live
  # Supabase never prove this: the order there could differ, and a file that
  # depends on something an earlier one dropped would still "work".
  #
  # This also guards the bookkeeping. Ten migrations were once recorded under
  # timestamps that did not match their filenames (applied via Supabase MCP,
  # which stamps its own), so `supabase db push` would have re-run them — and
  # six of the six oldest are not idempotent. Nothing surfaced that until it
  # was looked for. The uniqueness checks below keep the filename the single
  # identity of a migration.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # No password anywhere: the container is throwaway and reachable only
          # from this job. A hardcoded one would be a false positive the secret
          # scanner flags on every run, which teaches people to ignore it.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Migration filenames must stay unique
        run: |
          cd supabase/migrations
          dupe_version=$(ls *.sql | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dupe_version" ]; then
            echo "Duplicate version prefix: $dupe_version"; exit 1
          fi
          # The name is the fallback identity when a version gets mis-stamped.
          dupe_name=$(ls *.sql | sed -E 's/^[0-9]+_//; s/\.sql$//' | sort | uniq -d)
          if [ -n "$dupe_name" ]; then
            echo "Duplicate migration name: $dupe_name"; exit 1
          fi
          bad=$(ls *.sql | grep -vE '^[0-9]{14}_[a-z0-9_]+\.sql$' || true)
          if [ -n "$bad" ]; then
            echo "Filename is not <14-digit timestamp>_<snake_case>.sql: $bad"; exit 1
          fi

      - name: Apply every migration to an empty database
        env:
          # `drop … if exists` inside the migrations emits a NOTICE per object;
          # on a clean database that is ~60 lines of noise that hides real output.
          PGOPTIONS: -c client_min_messages=warning
          PSQL: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 --quiet
        run: |
          $PSQL -f supabase/ci/pg-stub.sql
          for f in supabase/migrations/*.sql; do
            echo "  $(basename "$f")"
            $PSQL -f "$f"
          done

      - name: Report resulting schema
        run: |
          psql -h localhost -U postgres -d postgres -t -A -c "
            select 'tables:   ' || count(*) from information_schema.tables where table_schema='public'
            union all select 'enums:    ' || count(*) from pg_type t
              join pg_namespace n on n.oid=t.typnamespace where n.nspname='public' and t.typtype='e'
            union all select 'policies: ' || count(*) from pg_policies where schemaname='public'
            union all select 'functions:' || count(*) from pg_proc p
              join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'
            union all select 'no RLS:   ' || count(*) from pg_tables
              where schemaname='public' and not rowsecurity
          " | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Every public table must have RLS enabled
        run: |
          open=$(psql -h localhost -U postgres -d postgres -t -A -c "
            select string_agg(tablename, ', ') from pg_tables
             where schemaname='public' and not rowsecurity")
          if [ -n "$open" ]; then
            echo "Tables without RLS: $open"; exit 1
          fi
